name: Run Pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: true

    - name: Install lint tooling
      # Only the dev group: ruff needs no torch, so this skips the heavy install.
      run: uv sync --only-group dev

    - name: Ruff lint
      run: uv run --no-sync ruff check --output-format=github

    - name: Ruff format check
      run: uv run --no-sync ruff format --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]  # project requires-python = ">=3.12"

    env:
      # uv provisions the interpreter itself; this overrides .python-version so
      # the matrix actually tests different versions.
      UV_PYTHON: ${{ matrix.python-version }}
      # Never update the lockfile as a side effect of `uv run` in the makefile.
      UV_LOCKED: "1"
      # Picked up by the makefile's `TORCH_EXTRA ?= cu126`: CPU wheels only, since
      # the runner has no GPU and the CUDA build pulls in GBs of nvidia-* packages.
      TORCH_EXTRA: cpu

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: true

    - name: Cache pretrained torchvision weights
      uses: actions/cache@v6
      with:
        # test_model_creation builds ResNet50 / EfficientNet-B4 with IMAGENET1K_V1
        # weights; without this they are re-downloaded on every run.
        path: ~/.cache/torch
        key: torch-hub-${{ runner.os }}

    - name: Install dependencies
      run: uv sync --extra "$TORCH_EXTRA"  # --locked: fail on lockfile drift

    - name: Run tests with pytest
      run: make test-report

    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: reports/test-results.xml
        if-no-files-found: warn
      if: always()  # Uploads even if tests fail
